services:
  - type: web
    name: foodflow
    runtime: static
    buildCommand: npm install --no-audit && npm run build
    staticPublishPath: ./dist/foodflow/browser
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      # Regla SPA: Redirige todas las rutas al index.html para que el enrutador de Angular funcione sin errores 404 al recargar
      - type: rewrite
        source: /*
        destination: /index.html
